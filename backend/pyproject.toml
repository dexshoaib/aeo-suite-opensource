[project]
name = "aeo-suite-backend"
version = "0.2.0"
description = "AEO Suite backend - Django/DRF skeleton (chunk 0.2)"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<7.0",
    "djangorestframework>=3.17.0",
    "django-allauth>=65.13.1",
    "django-environ>=0.12",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
