[package]
name = "crawler"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
hmac = "0.12.1"
ipnet = "2.10.1"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["full"] }
url = "2.5.4"

[dev-dependencies]
wiremock = "0.6.2"

[[bin]]
name = "crawler_preflight"
path = "src/bin/crawler_preflight.rs"
