# AEO Suite CI.
#
# Stage order (product rule): lint -> typecheck -> unit -> build ->
# integration -> e2e -> security audit. Stages light up as areas land;
# an area not yet wired runs a GUARDED placeholder: if real project
# files appear without the stage being wired, the job FAILS.
# Green-with-placeholders must never become silent fake-green.
#
# frontend: the guarded placeholder was retired in the same change that
# landed the app skeleton (package.json et al.) — the same-change rule
# the backend job followed. The real frontend job (install with
# --frozen-lockfile / lint / typecheck / test / build / client drift
# gate) arrives with the frontend CI wiring.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  alive:
    name: Workflow alive (always on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the workflow itself executes
        run: echo "CI alive on ${GITHUB_SHA::7}"

  backend:
    name: backend - lint, checks, strict schema, pytest (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The service container below owns this DSN; pytest-django
      # creates and destroys test_aeo_suite around the run.
      DATABASE_URL: postgres://aeo:aeo@localhost:5432/aeo_suite
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aeo
          POSTGRES_PASSWORD: aeo
          POSTGRES_DB: aeo_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeo -d aeo_suite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: System checks
        run: uv run python manage.py check
      - name: Migrations are complete
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema, strict (zero warnings tolerated)
        run: uv run python manage.py spectacular --file /tmp/schema.yaml --validate --fail-on-warn
      - name: Test suite on real Postgres
        run: uv run pytest

  crawler:
    name: crawler - guarded placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded placeholder
        run: |
          if [ -f crawler/Cargo.toml ]; then
            echo "::error::crawler/ contains real code but the cargo stage is not wired yet."
            echo "::error::Wire cargo fmt --check + clippy -D warnings + cargo check before merging."
            exit 1
          fi
          echo "crawler/ has only placeholders - cargo checks land with the crawler service"
