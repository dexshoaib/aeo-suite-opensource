# AEO Suite CI skeleton (chunk 0.1).
#
# Stage order (product rule): lint -> typecheck -> unit -> build ->
# integration -> e2e -> security audit. Stages light up as chunks land;
# each area job below currently runs a GUARDED placeholder: if real
# project files appear without the stage being wired, the job FAILS.
# Green-with-placeholders is not allowed to become silent fake-green.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      crawler: ${{ steps.filter.outputs.crawler }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            crawler:
              - 'crawler/**'

  skeleton:
    name: Workflow alive (always on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the workflow itself executes
        run: echo "CI skeleton alive on ${GITHUB_SHA::7}"

  backend:
    name: backend - lint + typecheck (ruff)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded placeholder
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/manage.py ]; then
            echo "::error::backend/ contains real code but ruff stage is not wired yet."
            echo "::error::Wire lint+typecheck for real in chunk 0.2 before merging."
            exit 1
          fi
          echo "backend/ has only placeholders - ruff lands in chunk 0.2"

  frontend:
    name: frontend - lint + typecheck (eslint + tsc)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded placeholder
        run: |
          if [ -f frontend/package.json ]; then
            echo "::error::frontend/ contains real code but eslint+tsc stage is not wired yet."
            echo "::error::Wire lint+typecheck for real in chunk 0.3 before merging."
            exit 1
          fi
          echo "frontend/ has only placeholders - eslint+tsc land in chunk 0.3"

  crawler:
    name: crawler - fmt + clippy + check (cargo)
    needs: changes
    if: ${{ needs.changes.outputs.crawler == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded placeholder
        run: |
          if [ -f crawler/Cargo.toml ]; then
            echo "::error::crawler/ contains real code but cargo stage is not wired yet."
            echo "::error::Wire cargo fmt --check + clippy -D warnings + cargo check in chunk 1.1."
            exit 1
          fi
          echo "crawler/ has only placeholders - cargo checks land in chunk 1.1"

  # TODO(chunk-0.2): unit tests - pytest with a real Postgres service container
  # TODO(chunk-0.3): build - pnpm build for frontend/ (and client regen check)
  # TODO(chunk-1.3): integration tests - Django + queue round-trip
  # TODO(chunk-0.3+): e2e - Playwright flows
  # TODO(chunk-0.2): security audit - pip-audit + npm audit + cargo audit as areas land
