# AEO Suite CI.
#
# Stage order (product rule): lint -> typecheck -> unit -> build ->
# integration -> e2e -> security audit. Stages light up as areas land;
# an area not yet wired runs a GUARDED placeholder: if real project
# files appear without the stage being wired, the job FAILS.
# Green-with-placeholders must never become silent fake-green.
#
# frontend: install with --frozen-lockfile, lint, typecheck, unit
# tests (vitest), build (next build), and the client drift gate
# (regenerates from the backend's strict OpenAPI schema and asserts
# zero diff on schema.d.ts).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alive:
    name: Workflow alive (always on)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove the workflow itself executes
        run: echo "CI alive on ${GITHUB_SHA::7}"

  backend:
    name: backend - lint, checks, strict schema, pytest (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # The service container below owns this DSN; pytest-django
      # creates and destroys test_aeo_suite around the run.
      DATABASE_URL: postgres://aeo:aeo@localhost:5432/aeo_suite
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aeo
          POSTGRES_PASSWORD: aeo
          POSTGRES_DB: aeo_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeo -d aeo_suite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: System checks
        run: uv run python manage.py check
      - name: Migrations are complete
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema, strict (zero warnings tolerated)
        run: uv run python manage.py spectacular --file /tmp/schema.yaml --validate --fail-on-warn
      - name: Test suite on real Postgres
        run: uv run pytest

  frontend:
    name: frontend - install, lint, typecheck, test, build, client drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json   # the packageManager pin lives here, not at repo root
      - uses: actions/setup-node@v4
        with:
          node-version: 22                            # matches engines.node >=22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        run: pnpm lint
      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Build (next build)
        run: pnpm build
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Export OpenAPI schema from backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run python manage.py spectacular --file /tmp/schema.yaml
      - name: Client drift gate (schema.d.ts must be current)
        run: |
          pnpm exec openapi-typescript /tmp/schema.yaml -o src/lib/api/schema.d.ts
          git diff --exit-code -- src/lib/api/schema.d.ts

  crawler:
    name: crawler - fmt, clippy, cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry, index and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crawler -> target
      - name: Format check
        run: cargo fmt --check
      - name: Clippy check (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Cargo test
        run: cargo test --all-targets
